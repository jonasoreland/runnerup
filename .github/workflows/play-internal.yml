name: Publish Relven to Play Internal Testing

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VALIDATE_SIGNING_ONLY or PUBLISH_INTERNAL
        required: true
        type: string
      phone_version_code:
        description: Even phone version code, greater than every code already uploaded in Play Console; Wear uses the next code
        required: true
        default: '24000376'
        type: string

permissions:
  contents: read

concurrency:
  group: play-internal-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/master' &&
      (inputs.confirm == 'PUBLISH_INTERNAL' || inputs.confirm == 'VALIDATE_SIGNING_ONLY')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Validate phone Play version code
        env:
          PHONE_VERSION_CODE: ${{ inputs.phone_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          import sys

          value = os.environ.get("PHONE_VERSION_CODE", "")
          if not re.fullmatch(r"[0-9]+", value):
              sys.exit("phone_version_code must contain decimal digits only")
          phone_code = int(value)
          if phone_code <= 24000374 or phone_code % 2 != 0 or phone_code > 2099999998:
              sys.exit("phone_version_code must be even, greater than 24000374, and leave room for Wear's +1 code")
          print(f"RELVEN_PLAY_VERSION_CODE={phone_code}")
          PY

      - name: Setup Android SDK
        shell: bash
        run: |
          sdk_root=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD in repository Actions secrets}"
          : "${ANDROID_KEY_ALIAS:?Configure ANDROID_KEY_ALIAS in repository Actions secrets}"
          : "${ANDROID_KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD in repository Actions secrets}"

          keystore_file="$RUNNER_TEMP/relven-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          test -s "$keystore_file"

          python3 - "$RUNNER_TEMP/relven-upload.jks" <<'PY'
          import os
          import sys

          values = {
              "keyStore": sys.argv[1],
              "keyStorePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyAliasPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }

          def escape(value):
              if "\n" in value or "\r" in value:
                  sys.exit("Signing properties must not contain line breaks")
              escaped = []
              for character in value:
                  if character == "\\":
                      escaped.append("\\\\")
                  elif character in " :=#!":
                      escaped.append("\\" + character)
                  elif ord(character) < 0x20 or ord(character) > 0x7e:
                      units = character.encode("utf-16-be")
                      escaped.extend(f"\\u{int.from_bytes(units[i:i + 2], 'big'):04X}" for i in range(0, len(units), 2))
                  else:
                      escaped.append(character)
              return "".join(escaped)

          with open("release.properties", "w", encoding="ascii", newline="\n") as properties_file:
              for key, value in values.items():
                  properties_file.write(f"{key}={escape(value)}\n")
          PY
          chmod 600 release.properties

      - name: Restore Play service account
        if: inputs.confirm == 'PUBLISH_INTERNAL'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64:?Configure GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 in repository Actions secrets}"
          service_account_file="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$service_account_file"
          chmod 600 "$service_account_file"
          test -s "$service_account_file"

          python3 - "$service_account_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as credential_file:
                  credentials = json.load(credential_file)
          except (OSError, UnicodeError, json.JSONDecodeError):
              sys.exit("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 must decode to valid JSON")

          required = ("type", "client_email", "private_key")
          if not isinstance(credentials, dict) or credentials.get("type") != "service_account" or any(
              not isinstance(credentials.get(key), str) or not credentials[key].strip()
              for key in required
          ):
              sys.exit("Google Play service-account JSON is missing required service-account fields")
          PY

      - name: Install bundletool
        shell: bash
        run: curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"

      - name: Run tests, release lint, and build signed bundles
        env:
          PHONE_VERSION_CODE: ${{ inputs.phone_version_code }}
        shell: bash
        run: >-
          ./gradlew --no-daemon test
          :app:lintLatestRelease :wear:lintRelease :hrdevice:lintRelease :common:lintRelease
          :app:bundleLatestRelease :wear:bundleRelease
          -PrelvenPlayVersionCode="$PHONE_VERSION_CODE"

      - name: Verify Play bundles before upload
        shell: bash
        run: |
          set -euo pipefail
          phone_aab=app/build/outputs/bundle/latestRelease/app-latest-release.aab
          wear_aab=wear/build/outputs/bundle/release/wear-release.aab
          test -s "$phone_aab"
          test -s "$wear_aab"
          jarsigner -verify "$phone_aab" >/dev/null 2>&1
          jarsigner -verify "$wear_aab" >/dev/null 2>&1
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$phone_aab" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$wear_aab" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$phone_aab" --module=base > "$RUNNER_TEMP/phone-manifest.xml"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$wear_aab" --module=base > "$RUNNER_TEMP/wear-manifest.xml"
          python3 - "$RUNNER_TEMP/phone-manifest.xml" "$RUNNER_TEMP/wear-manifest.xml" "$RELVEN_PLAY_VERSION_CODE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          android = "http://schemas.android.com/apk/res/android"
          package_name = "se.hampusandersson.relven"
          phone_code = int(sys.argv[3])

          def read_manifest(path):
              try:
                  return ET.parse(path).getroot()
              except (OSError, ET.ParseError) as error:
                  sys.exit(f"Could not parse bundle manifest: {error}")

          def check_common(manifest, expected_code, label):
              if manifest.get("package") != package_name:
                  sys.exit(f"{label} bundle package ID is not {package_name}")
              if manifest.get(f"{{{android}}}versionCode") != str(expected_code):
                  sys.exit(f"{label} bundle version code does not match {expected_code}")

          phone = read_manifest(sys.argv[1])
          wear = read_manifest(sys.argv[2])
          check_common(phone, phone_code, "Phone")
          check_common(wear, phone_code + 1, "Wear")

          watch_feature = "android.hardware.type.watch"
          phone_requires_watch = any(
              element.get(f"{{{android}}}name") == watch_feature
              and element.get(f"{{{android}}}required", "true").lower() == "true"
              for element in phone.findall("uses-feature")
          )
          if phone_requires_watch:
              sys.exit("Phone bundle unexpectedly requires watch hardware")

          wear_requires_watch = any(
              element.get(f"{{{android}}}name") == watch_feature
              and element.get(f"{{{android}}}required", "true").lower() == "true"
              for element in wear.findall("uses-feature")
          )
          if not wear_requires_watch:
              sys.exit("Wear bundle must require watch hardware")

          standalone = next(
              (element for element in wear.findall("application/meta-data")
               if element.get(f"{{{android}}}name") == "com.google.android.wearable.standalone"),
              None,
          )
          if standalone is None or standalone.get(f"{{{android}}}value", "").lower() != "false":
              sys.exit("Wear bundle must declare com.google.android.wearable.standalone=false")
          PY

          phone_cert=$(keytool '-J-Duser.language=en' '-J-Duser.country=US' -printcert -jarfile "$phone_aab" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          wear_cert=$(keytool '-J-Duser.language=en' '-J-Duser.country=US' -printcert -jarfile "$wear_aab" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$phone_cert"
          test "$phone_cert" = "$wear_cert"
          echo "Phone and Wear bundles use the same upload certificate."
          {
            echo "## Relven upload certificate validation"
            echo "Phone and Wear bundles use the same upload certificate."
            echo "SHA-256 fingerprint (lowercase, no separators): `$phone_cert`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Wear OS bundle to Play Internal Testing
        if: inputs.confirm == 'PUBLISH_INTERNAL'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play-service-account.json
          packageName: se.hampusandersson.relven
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          tracks: wear:internal
          status: completed

      - name: Publish phone bundle to Play Internal Testing
        if: inputs.confirm == 'PUBLISH_INTERNAL'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play-service-account.json
          packageName: se.hampusandersson.relven
          releaseFiles: app/build/outputs/bundle/latestRelease/app-latest-release.aab
          tracks: internal
          status: completed

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/relven-upload.jks"
          rm -f "$RUNNER_TEMP/google-play-service-account.json"
          rm -f "$RUNNER_TEMP/bundletool.jar"
          rm -f "$RUNNER_TEMP/phone-manifest.xml" "$RUNNER_TEMP/wear-manifest.xml"
          rm -f "$GITHUB_WORKSPACE/release.properties"
