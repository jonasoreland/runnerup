      const modeButtons = document.querySelectorAll('[data-purpose="mode-selectors"] button');
      modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          modeButtons.forEach(b => {
            b.classList.remove('bg-white/10', 'border-white/20', 'text-white');
            b.classList.add('bg-white/[0.04]', 'border-white/10', 'text-slate-300');
          });
          btn.classList.add('bg-white/10', 'border-white/20', 'text-white');
          btn.classList.remove('bg-white/[0.04]', 'border-white/10', 'text-slate-300');
        });
      });
    });
  </script>
<!-- END: Interactive Feedback Handling Script -->
