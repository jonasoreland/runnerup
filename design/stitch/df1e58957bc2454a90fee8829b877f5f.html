<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">

<title>Relven - Running Mode</title>
<!-- Tailwind CSS CDN -->

<script>

      theme: {

            sans: ['"Plus Jakarta Sans"', 'sans-serif'],

            brand: {
              orange: '#FF5C00',

<style data-purpose="base-styling">

<style data-purpose="map-effects">

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 92, 0, 0.6), 0 0 15px rgba(255, 92, 0, 0.4);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(255, 92, 0, 0), 0 0 25px rgba(255, 92, 0, 0.7);
      }
    }
    .pulse-avatar {
      animation: pulseGlow 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    /* Glassmorphism custom blur effect */
    .glass-panel {
      background: linear-gradient(180deg, rgba(22, 28, 36, 0.68) 0%, rgba(12, 17, 23, 0.88) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);

      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);

<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 bg-neutral-950">

<!-- BEGIN: GPSMapCanvas -->

<feMerge>
<feMergeNode in="blur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
</defs>
<!-- Base Background -->
<rect fill="url(#mapGlow)" height="860" width="412"></rect>
<!-- Topographic Contour / Area Shapes -->

<!-- BEGIN: InteractivePlayScript -->
<script data-purpose="toggle-workout-interactivity">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('run-control-toggle');
      let isPaused = false;

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          isPaused = !isPaused;
          if (isPaused) {
            // Switch to Pause icon
            toggleBtn.innerHTML = `
              <svg class="w-5 h-5 fill-none stroke-current" stroke-width="2.5" viewBox="0 0 24 24">
                <line x1="9" y1="5" x2="9" y2="19" stroke-linecap="round"></line>
                <line x1="15" y1="5" x2="15" y2="19" stroke-linecap="round"></line>
              </svg>
            `;
            toggleBtn.classList.add('bg-brand-orange/20', 'border-brand-orange/40');
          } else {
            // Restore Play triangle
            toggleBtn.innerHTML = `
              <svg class="w-5 h-5 fill-none stroke-current" stroke-width="2.2" viewBox="0 0 24 24" stroke-linejoin="round">
                <polygon points="6 4 19 12 6 20 6 4" stroke-linecap="round"></polygon>
              </svg>
            `;
            toggleBtn.classList.remove('bg-brand-orange/20', 'border-brand-orange/40');
          }
        });
      }
    });
  </script>
<!-- END: InteractivePlayScript -->
